name: CI/CD Pipeline

on:
  push:
    branches:
      - main # Chạy khi push code lên nhánh main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/huit-erp-backend:latest

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy to Ubuntu Server via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          
          # Copy docker-compose.yml to remote server via SCP (works for private repos)
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $SSH_USERNAME@$SSH_HOST "mkdir -p ~/huit-erp-backend"
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no docker-compose.yml $SSH_USERNAME@$SSH_HOST:~/huit-erp-backend/docker-compose.yml
          
          # Execute Docker commands
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $SSH_USERNAME@$SSH_HOST << EOF
            cd ~/huit-erp-backend
            echo "$SSH_PASSWORD" | sudo -S docker pull $DOCKER_USERNAME/huit-erp-backend:latest
            echo "$SSH_PASSWORD" | sudo -S docker compose down
            echo "$SSH_PASSWORD" | sudo -S docker compose up -d
          EOF
